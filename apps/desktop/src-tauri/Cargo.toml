[package]
name = "hermes-llm"
version = "0.1.0"
description = "Private local AI for macOS"
authors = ["HERMES-LLM contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "hermes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "process", "sync", "time", "io-util", "macros"] }
tokio-util = "0.7"
futures-util = "0.3"
sha2 = "0.10"
walkdir = "2"
cap-std = "3"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["apple-native"] }
rand = "0.8"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
