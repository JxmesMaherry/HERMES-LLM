name: macOS DMG
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Verify version and tag
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"
      - run: npm run lint && npm test
      - name: Build ad-hoc signed Apple Silicon app and DMG
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop
          args: --target aarch64-apple-darwin --bundles app,dmg
        # For Developer ID signing, add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
        # APPLE_SIGNING_IDENTITY and notarization credentials here using secrets.
        # Also override bundle.macOS.signingIdentity (currently "-"). See docs/RELEASE.md.
      - name: Verify and name distribution artifact
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          bundle=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          app="$bundle/macos/HERMES-LLM.app"
          dmg=$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg" && test -s "$dmg"
          scripts/verify-bundle.sh "$app" "$dmg"
          mkdir -p .artifacts
          cp "$dmg" ".artifacts/HERMES-LLM_${version}_aarch64.dmg"
          (cd .artifacts && shasum -a 256 *.dmg > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HERMES-LLM-macOS-aarch64
          path: |
            .artifacts/HERMES-LLM_*_aarch64.dmg
            .artifacts/SHA256SUMS.txt
          # The staging directory is hidden; upload only these two distribution files.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified artifact and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name HERMES-LLM-macOS-aarch64 --dir .artifacts
          ./scripts/publish-release.sh "$GITHUB_REF_NAME" .artifacts
